[package]
name = "lpr-rs"
version = "0.1.0"
edition = "2021"
description = "High-performance two-stage Automatic License Plate Recognition (ALPR/ANPR) pipeline in Rust using ONNX Runtime"
license = "MIT"

[features]
default = []
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]
directml = ["ort/directml"]
coreml = ["ort/coreml"]
load-dynamic = ["ort/load-dynamic"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
image = "0.25"
imageproc = "0.25"
ort = { version = "2.0.0-rc.15", default-features = true }
rayon = "1.10"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
